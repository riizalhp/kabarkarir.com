<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KabarKarir.com - Portal Lowongan Kerja Indonesia untuk lulusan SMA/SMK, Diploma, hingga S1 dari perusahaan BUMN dan swasta.">
  <title>KabarKarir.com - Portal Lowongan Kerja Indonesia</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- SwiperJS CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'poppins': ['Poppins', 'sans-serif'],
          },
          colors: {
            'primary': '#3BADEF',
            'secondary': '#1F2937',
            'accent': '#F9812A',
            'light': '#f8fafc',
          },
        }
      }
    }
  </script>
  <style>
     body {
      font-family: 'Poppins', 'sans-serif';
      color: #333;
      background-color: #f5f7fa;
    }
    .text-truncate-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* Swiper Custom Styles */
    .swiper-pagination-bullet {
        background: #d1d5db;
        opacity: 1;
        width: 10px;
        height: 10px;
    }
    .swiper-pagination-bullet-active {
        background: #3BADEF;
    }
    .aspect-banner {
        position: relative;
        width: 100%;
        padding-top: 80%;
    }

    @media (min-width: 768px) {
        .aspect-banner {
            padding-top: 40%;
        }
    }

    .aspect-banner .swiper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }
    
    .aspect-ad-banner {
        position: relative;
        width: 100%;
        padding-top: 25%;
    }

    @media (min-width: 768px) {
        .aspect-ad-banner {
            padding-top: 14%;
        }
    }
    
    .aspect-ad-banner .swiper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }
    .responsive-iframe-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding-top: 56.25%;
    }
    .responsive-iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- SwiperJS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <!-- Add SheetJS/xlsx library -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
